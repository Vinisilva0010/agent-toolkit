[project]
name = "triagem-atendimento"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vinicius", email = "vns.pontual77@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.6.3",
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.11",
    "python-dotenv>=1.2.3",
]

[project.scripts]
triagem-atendimento = "triagem_atendimento:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]
